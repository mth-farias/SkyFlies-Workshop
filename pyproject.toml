[project]
name = "skyflies-workshop"
version = "0.1.0"
description = "Student workshop: open-source data and AI tools for artwork."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 80
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"workshop/_lib/__init__.py" = ["D104"]
